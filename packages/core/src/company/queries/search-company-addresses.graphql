query SearchCompanyAddresses(
    $searchQuery: String
    $first: Int = 10
    $isShipping: Boolean
    $isBilling: Boolean
) {
    customer {
        activeCompany {
            companyName
            addresses(
                first: $first
                filters: {
                    searchQuery: $searchQuery
                    isShipping: $isShipping
                    isBilling: $isBilling
                }
                sort: [{ field: CREATED_AT, direction: DESC }]
                includesExtraFields: true
            ) {
                edges {
                    node {
                        ...CompanyAddressFields
                    }
                }
                pageInfo {
                    hasNextPage
                    endCursor
                }
            }
        }
    }
}

fragment CompanyAddressFields on CompanyAddress {
    entityId
    firstName
    lastName
    address1
    address2
    city
    stateOrProvince
    stateOrProvinceCode
    postalCode
    country
    countryCode
    phone
    label
    company: companyName
    isDefaultShipping
    isDefaultBilling
    isShipping
    isBilling
    extraFields {
        ...CompanyAddressExtraField
    }
}

fragment CompanyAddressExtraField on ExtraFieldValue {
    __typename
    name
    fieldEntityId
    ... on TextExtraFieldValue {
        text
    }
    ... on MultilineTextExtraFieldValue {
        multilineText
    }
    ... on NumberExtraFieldValue {
        number
    }
    ... on MultipleChoiceExtraFieldValue {
        value
    }
}
